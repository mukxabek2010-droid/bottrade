<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BotTrade Profile</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Profil Kartochkasi */
        .profile-card {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        /* Tepadagi Header: Rasm + Nick */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 15px;
        }

        /* TO'RTBURCHAK AVATAR */
        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 12px; /* To'rtburchak burchaklari sal yumshatilgan */
            object-fit: cover;
            border: 2px solid #7928ca;
            background-color: #1a1d26;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .nickname {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .username-tag {
            font-size: 0.8rem;
            color: #8f94a6;
        }

        /* Chiziq */
        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin-bottom: 15px;
        }

        /* Balans Bo'limi */
        .balance-box {
            background: linear-gradient(135deg, rgba(121, 40, 202, 0.15), rgba(0, 223, 216, 0.05));
            border: 1px solid rgba(0, 223, 216, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-label {
            font-size: 0.85rem;
            color: #a0a5c0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .balance-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #00dfd8;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Tepasi: To'rtburchak rasm va Nick -->
        <div class="profile-header">
            <img id="user-avatar" class="avatar" src="https://via.placeholder.com/150/7928ca/ffffff?text=User" alt="Avatar">
            <div class="user-info">
                <span id="user-nick" class="nickname">Yuklanmoqda...</span>
                <span id="user-tag" class="username-tag">@username</span>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Pasti: Balans -->
        <div class="balance-box">
            <span class="balance-label">Hisob balansi:</span>
            <span id="user-balance" class="balance-value">0 so'm</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Telegram foydalanuvchisi ma'lumotlari
        const user = tg.initDataUnsafe?.user;

        if (user) {
            // Niki va Username
            document.getElementById('user-nick').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
            document.getElementById('user-tag').innerText = user.username ? `@${user.username}` : `ID: ${user.id}`;
            
            // Profil rasmi (bo'lsa Telegramniki, bo'lmasa standart)
            if (user.photo_url) {
                document.getElementById('user-avatar').src = user.photo_url;
            }
        } else {
            document.getElementById('user-nick').innerText = "Test Foydalanuvchi";
            document.getElementById('user-tag').innerText = "@test_user";
        }

        // URL parametrlaridan balansni o'qib olish (Masalan: site.com/?balance=50000)
        const urlParams = new URLSearchParams(window.location.search);
        const userBalance = urlParams.get('balance');

        if (userBalance !== null) {
            // Balansni chiroyli formatda ko'rsatish (masalan: 50 000 so'm)
            document.getElementById('user-balance').innerText = Number(userBalance).toLocaleString('uz-UZ') + " so'm";
        } else {
            document.getElementById('user-balance').innerText = "0 so'm";
        }
    </script>
</body>
</html>
