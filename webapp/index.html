<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Crash Pro - Casino</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#070510;
    --bg-mid:#0f0b24;
    --violet:#7c5cff;
    --violet-2:#5b3df0;
    --gold:#ffc93c;
    --gold-2:#ff9d3c;
    --ink:#f4f2ff;
    --ink-dim:rgba(244,242,255,.62);
    --card:rgba(255,255,255,.05);
    --card-line:rgba(255,255,255,.08);
    --green:#3ddc84;
    --red:#ff4d4d;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --navh: 62px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Manrope',system-ui,sans-serif;
    color:var(--ink);
    background: radial-gradient(1200px 600px at 20% -10%, rgba(124,92,255,.22), transparent 60%),
                radial-gradient(800px 500px at 80% 100%, rgba(255,201,60,.12), transparent 50%),
                linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
    background-attachment:fixed;
    overflow-x:hidden;
  }
  
  .wrap{
    position:relative; z-index:1;
    max-width:480px; margin:0 auto;
    padding: calc(10px + var(--safe-top)) 12px calc(var(--navh) + 16px + var(--safe-bottom));
    min-height:100vh;
    display:flex; flex-direction:column; gap:12px;
  }

  /* HEADER */
  .header{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:rgba(20, 15, 45, 0.7); border:1px solid var(--card-line);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-radius:20px; padding:10px 12px;
  }
  .user-block{display:flex; align-items:center; gap:10px; min-width:0;}
  .avatar-ring{width:42px;height:42px; border-radius:50%; padding:2px;
    background:linear-gradient(135deg,var(--gold),var(--violet)); flex-shrink:0;}
  .avatar{width:100%;height:100%;border-radius:50%; display:flex;align-items:center;justify-content:center;
    background:var(--bg-mid); color:var(--gold); font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; object-fit:cover;}
  .who{min-width:0;}
  .who .name{font-weight:800; font-size:13px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .who .idbadge{font-family:'Space Grotesk',monospace; font-size:10px; color:var(--ink-dim); margin-top:2px; display:inline-block;}

  .header-balance{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,201,60,.1); border:1px solid rgba(255,201,60,.25);
    padding:6px 10px; border-radius:14px; cursor:pointer;
  }
  .bal-info{display:flex; flex-direction:column; align-items:flex-end;}
  .bal-label{font-size:9px; font-weight:700; color:var(--gold); text-transform:uppercase; letter-spacing:0.5px;}
  .bal-num{font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:14px; color:#fff;}
  .add-btn{
    width:28px; height:28px; border-radius:10px; border:none;
    background:linear-gradient(135deg,var(--gold),var(--gold-2)); color:#1a0f00;
    font-size:16px; font-weight:800; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  /* PANELS */
  .panel{display:none; flex-direction:column; gap:12px; animation:fadein .2s ease;}
  .panel.active{display:flex;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .card{background:var(--card); border:1px solid var(--card-line); border-radius:20px; padding:14px;}

  /* CRASH STAGE */
  .crash-card{display:flex; flex-direction:column; gap:12px; position:relative;}
  
  .canvas-stage{
    position:relative; width:100%; height:210px; border-radius:16px; overflow:hidden;
    background: radial-gradient(circle at 50% 30%, #151035, #080514);
    border:1px solid rgba(124,92,255,.25);
    box-shadow: inset 0 0 20px rgba(0,0,0,.6);
  }
  canvas#crashCanvas{width:100%; height:100%; display:block;}
  
  .crash-overlay{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; pointer-events:none;
  }
  .crash-mult-val{
    font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:48px; letter-spacing:-1px;
    text-shadow: 0 0 20px rgba(124,92,255,.6); transition:color .2s;
  }
  .crash-mult-val.running{color:#fff;}
  .crash-mult-val.crashed{color:var(--red); text-shadow:0 0 20px rgba(255,77,77,.8);}
  .crash-mult-val.won{color:var(--green); text-shadow:0 0 20px rgba(61,220,132,.8);}
  .crash-status-txt{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--ink-dim); margin-top:-4px;}

  .sound-toggle{
    position:absolute; top:10px; right:10px; z-index:5;
    background:rgba(0,0,0,.5); border:1px solid var(--card-line); color:#fff;
    border-radius:10px; padding:4px 8px; font-size:11px; cursor:pointer; backdrop-filter:blur(4px);
  }

  .crash-history{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
  .crash-history::-webkit-scrollbar{display:none;}
  .h-chip{font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:700; padding:4px 8px; border-radius:8px; flex-shrink:0;}
  .h-chip.win{background:rgba(61,220,132,.18); color:var(--green); border:1px solid rgba(61,220,132,.3);}
  .h-chip.lose{background:rgba(255,77,77,.18); color:var(--red); border:1px solid rgba(255,77,77,.3);}

  .bet-box{display:flex; flex-direction:column; gap:8px;}
  .bet-input-wrap{display:flex; gap:8px;}
  .bet-input{
    flex:1; background:rgba(255,255,255,.06); border:1px solid var(--card-line); border-radius:14px;
    padding:12px 14px; color:var(--ink); font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px;
  }
  .bet-input:focus{outline:none; border-color:var(--gold);}
  
  .big-btn{
    width:100%; padding:14px; border:none; border-radius:14px;
    font-family:'Manrope',sans-serif; font-weight:800; font-size:15px; cursor:pointer;
    transition:transform .1s ease;
  }
  .big-btn:active{transform:scale(.98);}
  .big-btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-2)); color:#1a0f00; box-shadow:0 6px 20px rgba(255,157,60,.35);}
  .big-btn.green{background:linear-gradient(135deg,#3ddc84,#25a25a); color:#00240f; box-shadow:0 6px 20px rgba(61,220,132,.35);}
  .big-btn.disabled{opacity:.5; cursor:not-allowed;}

  .chip-row{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    background:rgba(255,255,255,.06); border:1px solid var(--card-line); border-radius:10px;
    padding:6px 10px; font-size:11px; font-weight:700; cursor:pointer; color:var(--ink-dim); flex:1; text-align:center;
  }
  .chip:active{background:rgba(255,255,255,.15); color:#fff;}

  .live-bets-wrap{display:flex; flex-direction:column; gap:6px; margin-top:4px;}
  .live-bets-header{display:flex; justify-content:space-between; font-size:11px; font-weight:700; color:var(--ink-dim); padding:0 4px;}
  .live-bets-list{display:flex; flex-direction:column; gap:4px; max-height:160px; overflow-y:auto;}
  .bet-row-item{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.05); border-radius:10px;
    padding:7px 10px; font-size:12px;
  }
  .bet-user{display:flex; align-items:center; gap:8px;}
  .bet-user .b-avatar{width:22px; height:22px; border-radius:50%; background:var(--violet-2); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800;}
  .bet-user .b-name{font-weight:700;}
  .bet-info{display:flex; align-items:center; gap:10px;}
  .bet-amt{font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--ink-dim);}
  .bet-res{font-family:'Space Grotesk',sans-serif; font-weight:700; width:60px; text-align:right;}
  .bet-res.win{color:var(--green);}
  .bet-res.playing{color:var(--gold);}
  .bet-res.lost{color:var(--red);}

  /* Menu Grid */
  .menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .menu-item{background:rgba(255,255,255,.05); border:1px solid var(--card-line); border-radius:16px; padding:16px; text-align:center; cursor:pointer;}
  .menu-item .ico{font-size:26px;} .menu-item .lab{font-size:13px; font-weight:700; margin-top:6px;}

  /* Profile Panel */
  .profile-hero{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; padding-top:6px;}
  .profile-hero .avatar-ring{width:70px;height:70px;}
  .profile-hero .avatar{font-size:24px;}
  .profile-hero .pname{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;}
  .profile-hero .puname{font-size:12px; color:var(--ink-dim);}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
  .stat-box{background:rgba(255,255,255,.05); border:1px solid var(--card-line); border-radius:14px; padding:12px;}
  .stat-box .lab{font-size:11px; color:var(--ink-dim);}
  .stat-box .val{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; margin-top:3px;}

  /* Bottom Nav */
  .navbar{position:fixed; left:0; right:0; bottom:0; z-index:20; padding-bottom:var(--safe-bottom);
    background:rgba(7,5,16,.9); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-top:1px solid var(--card-line);}
  .navbar-inner{max-width:480px; margin:0 auto; height:var(--navh); display:flex;}
  .nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; background:none; border:none; color:var(--ink-dim); cursor:pointer;}
  .nav-btn.active{color:var(--gold);}
  .nav-btn .ico{font-size:20px;} .nav-btn .lab{font-size:11px; font-weight:700;}
</style>
</head>
<body>

  <div class="wrap">

    <!-- HEADER -->
    <div class="header">
      <div class="user-block">
        <div class="avatar-ring">
          <img class="avatar" id="avatarImg" alt="" style="display:none;">
          <div class="avatar" id="avatarFallback">?</div>
        </div>
        <div class="who">
          <div class="name" id="userName">Yuklanmoqda...</div>
          <span class="idbadge" id="userId">ID —</span>
        </div>
      </div>

      <div class="header-balance" id="topupBtn">
        <div class="bal-info">

          <span class="bal-num" id="headerBalance">— so'm</span>

    <!-- 1) CRASH GAME -->

        <div class="canvas-stage" id="canvasStage">
          <canvas id="crashCanvas"></canvas>
          <div class="crash-overlay">

    <!-- 2) MENYU -->
    <div class="panel" id="panel-menu">
      <div class="menu-grid">
        <div class="menu-item" data-action="open_deposit"><div class="ico">💰</div><div class="lab">Hisob to'ldirish</div></div>
        <div class="menu-item" data-action="open_withdraw"><div class="ico">💳</div><div class="lab">Pul yechish</div></div>
        <div class="menu-item" data-action="open_buy"><div class="ico">🛒</div><div class="lab">Robux do'kon</div></div>
        <div class="menu-item" data-action="open_referral"><div class="ico">🎁</div><div class="lab">Referal</div></div>
      </div>
    </div>

    <!-- 3) PROFIL -->
    <div class="panel" id="panel-profile">
      <div class="card profile-hero">
        <div class="avatar-ring">
          <img class="avatar" id="avatarImg2" alt="" style="display:none;">
          <div class="avatar" id="avatarFallback2">?</div>
        </div>
        <div class="pname" id="profileName">—</div>
        <div class="puname" id="profileUname"></div>
        <div class="idbadge" id="profileId">ID —</div>
      </div>
      <div class="stat-grid">
        <div class="stat-box"><div class="lab">💰 Balans</div><div class="val" id="pStatBalance">—</div></div>
        <div class="stat-box"><div class="lab">📈 Jami kiritilgan</div><div class="val" id="pStatDeposited">—</div></div>
        <div class="stat-box"><div class="lab">📅 Ro'yxatdan o'tgan</div><div class="val" id="pStatJoined">—</div></div>
        <div class="stat-box"><div class="lab">🎁 Referallar</div><div class="val" id="pStatRefs">—</div></div>
      </div>

  </div>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="navbar-inner">
      <button class="nav-btn active" data-tab="crash"><span class="ico">🚀</span><span class="lab">Crash</span></button>
      <button class="nav-btn" data-tab="menu"><span class="ico">☰</span><span class="lab">Menyu</span></button>
      <button class="nav-btn" data-tab="profile"><span class="ico">👤</span><span class="lab">Profil</span></button>
    </div>
  </div>

<script>
(function(){
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  function haptic(type){ if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(type || 'light'); }
  function notify(type){ if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(type); }
  function fmt(n){ try { return Math.round(Number(n)).toLocaleString('ru-RU'); } catch(e){ return n; } }
  function initials(str){ if(!str) return '?'; return str.trim().split(/\s+/).map(s=>s[0]).slice(0,2).join('').toUpperCase(); }

  let currentBalance = 0;
  const tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;

  function setAvatar(imgId, fbId, url, fallbackText){
    const img = document.getElementById(imgId), fb = document.getElementById(fbId);
    if (url) {
      img.src = url; img.style.display = 'block'; fb.style.display = 'none';
      img.onerror = function(){ img.style.display='none'; fb.style.display='flex'; };
    } else {
      fb.textContent = fallbackText;
    }
  }

  if (tgUser) {
    const fullName = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') || 'Foydalanuvchi';
    document.getElementById('userName').textContent = fullName;
    document.getElementById('userId').textContent = 'ID: ' + tgUser.id;
    
    document.getElementById('profileName').textContent = fullName;
    document.getElementById('profileUname').textContent = tgUser.username ? ('@' + tgUser.username) : '';
    document.getElementById('profileId').textContent = 'ID: ' + tgUser.id;

    setAvatar('avatarImg','avatarFallback', tgUser.photo_url, initials(fullName));
    setAvatar('avatarImg2','avatarFallback2', tgUser.photo_url, initials(fullName));
  } else {
    document.getElementById('userName').textContent = 'O\'yinchi';
  }

  function updateBalanceUI() {
    document.getElementById('headerBalance').textContent = fmt(currentBalance) + " so'm";
    document.getElementById('pStatBalance').textContent = fmt(currentBalance) + " so'm";
  }

  // 1. SERVERDAN BALANS OLISH
  async function loadMe(){
    if (!tg || !tg.initData) return;
    try {
      const res = await fetch('/webapp/api/me?initData=' + encodeURIComponent(tg.initData));
      if (!res.ok) throw new Error('unauthorized');
      const d = await res.json();
      currentBalance = d.balance || 0;
      updateBalanceUI();

      document.getElementById('pStatDeposited').textContent = fmt(d.total_deposited || 0) + " so'm";
      document.getElementById('pStatJoined').textContent = d.joined || '-';
      document.getElementById('pStatRefs').textContent = (d.ref_count || 0) + " ta";
    } catch(e) {
      updateBalanceUI();
    }
  }
  loadMe();

  // 2. BALANS O'ZGARISHLARINI SERVERGA SAQLASH (STAVKA & CASHOUT)
  async function syncBalanceWithServer(actionType, amount, multiplier = 1) {
    if (!tg || !tg.initData) return;
    try {
      const res = await fetch('/webapp/api/game-result', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          initData: tg.initData,
          action: actionType, // 'bet' yoki 'win'
          amount: amount,
          multiplier: multiplier
        })
      });
      const data = await res.json();
      if (data.ok && data.newBalance !== undefined) {
        currentBalance = data.newBalance;
        updateBalanceUI();
      }
    } catch(e) {
      console.error("Server bilan sinxronizatsiyada xatolik:", e);
    }
  }

  document.getElementById('topupBtn').addEventListener('click', function(){
    if (!tg) return;
    haptic('light');
    tg.sendData(JSON.stringify({ action: 'open_deposit' }));
    tg.close();
  });

  // SOUND FX ENGINE
  let soundEnabled = true;
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playEngineSound(freq) {
    if (!soundEnabled || audioCtx.state === 'suspended') return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq || 80, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } catch(e){}
  }

  function playWinSound() {
    if (!soundEnabled) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.1);
      osc.frequency.setValueAtTime(783.99, now + 0.2);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(now + 0.5);
    } catch(e){}
  }

  function playExplosionSound() {
    if (!soundEnabled) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(120, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(now + 0.3);
    } catch(e){}
  }

  document.getElementById('soundToggle').addEventListener('click', function(){
    soundEnabled = !soundEnabled;
    this.textContent = soundEnabled ? '🔊 Ovoz ON' : '🔇 Ovoz OFF';
    if (audioCtx.state === 'suspended') audioCtx.resume();
  });

  // TAB NAVIGATION
  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      haptic('light');
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      btn.classList.add('active');
    });
  });

  document.querySelectorAll('.menu-item').forEach(function(el){
    el.addEventListener('click', function(){
      if (!tg) return;
      haptic('light');
      tg.sendData(JSON.stringify({ action: el.dataset.action }));
      tg.close();
    });
  });

  // BOT SIMULATION
  const BOT_NAMES = ['Sardor', 'Jasur', 'Madina', 'CryptoKing', 'Bekzod', 'Aziz_77', 'Ali_Pro', 'SHOH', 'Diyorbek', 'Timur', 'Lola', 'Rustam'];
  let currentBots = [];

  function generateBots() {
    currentBots = [];
    const count = 10 + Math.floor(Math.random() * 5);
    for (let i = 0; i < count; i++) {
      const name = BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
      const bet = (Math.floor(Math.random() * 40) + 1) * 5000;
      const cashoutAt = (1.1 + Math.random() * 3.5);
      currentBots.push({
        id: i, name: name, bet: bet, cashoutAt: cashoutAt,
        cashedOut: false, wonAmt: 0, lost: false
      });
    }
  }

  function renderBotsTable() {
    const list = document.getElementById('liveBetsList');
    list.innerHTML = '';
    
    if (myBetState.placed) {
      const myRow = document.createElement('div');
      myRow.className = 'bet-row-item';
      myRow.style.background = 'rgba(124,92,255,.15)';
      myRow.style.border = '1px solid rgba(124,92,255,.3)';
      let statusHtml = `<span class="bet-res playing">O'yinda...</span>`;
      if(myBetState.cashedOut) statusHtml = `<span class="bet-res win">+${fmt(myBetState.winAmt)}</span>`;
      else if(myBetState.lost) statusHtml = `<span class="bet-res lost">Kuyib ketdi</span>`;

      myRow.innerHTML = `
        <div class="bet-user">
          <div class="b-avatar" style="background:var(--gold); color:#000;">SIZ</div>
          <div class="b-name">Sizning stavkangiz</div>
        </div>
        <div class="bet-info">
          <span class="bet-amt">${fmt(myBetState.amount)}</span>
          ${statusHtml}
        </div>
      `;
      list.appendChild(myRow);
    }

    currentBots.forEach(bot => {
      const item = document.createElement('div');
      item.className = 'bet-row-item';
      let statusHtml = `<span class="bet-res playing">O'yinda</span>`;
      if (bot.cashedOut) statusHtml = `<span class="bet-res win">+${fmt(bot.wonAmt)}</span>`;
      else if (bot.lost) statusHtml = `<span class="bet-res lost">Kuyib ketdi</span>`;

      item.innerHTML = `
        <div class="bet-user">
          <div class="b-avatar">${bot.name[0]}</div>
          <div class="b-name">${bot.name}</div>
        </div>
        <div class="bet-info">
          <span class="bet-amt">${fmt(bot.bet)}</span>
          ${statusHtml}
        </div>
      `;
      list.appendChild(item);
    });
  }

  // CANVAS ENGINE & CRASH LOOP
  const canvas = document.getElementById('crashCanvas');
  const ctx = canvas.getContext('2d');
  let canvasW, canvasH;

  function resizeCanvas(){
    canvasW = canvas.offsetWidth;
    canvasH = canvas.offsetHeight;
    canvas.width = canvasW * window.devicePixelRatio;
    canvas.height = canvasH * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let gameState = 'WAITING';
  let currentMult = 1.00;
  let targetCrashMult = 1.00;
  let countdown = 5;
  let particles = [];
  let myBetState = { placed: false, amount: 0, cashedOut: false, winAmt: 0, lost: false };

  const betInput = document.getElementById('betInput');
  const actionBtn = document.getElementById('crashActionBtn');
  const multEl = document.getElementById('crashMult');
  const statusEl = document.getElementById('crashStatus');

  document.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => {
      let cur = parseInt(betInput.value || 0, 10);
      if (c.dataset.amt) cur += parseInt(c.dataset.amt, 10);
      if (c.dataset.max) cur = Math.min(currentBalance, 200000);
      cur = Math.min(Math.max(cur, 1000), 200000);
      betInput.value = cur;
    });
  });

  // ACTION BUTTON LOGIC (WITH REAL-TIME BACKEND SYNC)
  actionBtn.addEventListener('click', async () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();

    // STAVKA TIKISH
    if (gameState === 'WAITING' && !myBetState.placed) {
      const amt = parseInt(betInput.value, 10);
      if (isNaN(amt) || amt < 1000 || amt > 200000) {
        alert("Stavka 1,000 va 200,000 so'm oralig'ida bo'lishi kerak.");
        return;
      }
      if (amt > currentBalance) {
        alert("Balans yetarli emas!");
        return;
      }

      currentBalance -= amt;
      updateBalanceUI();
      myBetState = { placed: true, amount: amt, cashedOut: false, winAmt: 0, lost: false };
      
      actionBtn.textContent = "Kutilmoqda...";
      actionBtn.className = "big-btn disabled";
      haptic('medium');
      renderBotsTable();

      // Serverdan ham balansni yechish
      await syncBalanceWithServer('bet', amt);
    } 
    // CASHOUT (PULNI YECHISH)
    else if (gameState === 'RUNNING' && myBetState.placed && !myBetState.cashedOut) {
      myBetState.cashedOut = true;
      const winAmount = Math.round(myBetState.amount * currentMult);
      myBetState.winAmt = winAmount;

      currentBalance += winAmount;
      updateBalanceUI();
      
      playWinSound();
      haptic('heavy');
      notify('success');

      actionBtn.textContent = "YUTDINGIZ!";
      actionBtn.className = "big-btn disabled";
      multEl.className = "crash-mult-val won";
      renderBotsTable();

      // Serverga yutuqni yozib qo'yish
      await syncBalanceWithServer('win', winAmount, currentMult);
    }
  });

  function generateCrashPoint() {
    const r = Math.random();
    if (r < 0.05) return 1.00;
    return parseFloat((1.01 + Math.pow(Math.random(), 3) * 15).toFixed(2));
  }

  function createParticle(x, y) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 2,
      vy: Math.random() * 2 + 1,
      size: Math.random() * 4 + 2,
      alpha: 1
    });
  }

  function drawCanvas(x, y, isCrashed) {
    ctx.clearRect(0, 0, canvasW, canvasH);

    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for (let i = 0; i < canvasW; i += 40) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvasH); ctx.stroke();
    }
    for (let j = 0; j < canvasH; j += 40) {
      ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvasW, j); ctx.stroke();
    }

    if (gameState === 'RUNNING' || gameState === 'CRASHED') {
      const grad = ctx.createLinearGradient(0, canvasH, x, y);
      grad.addColorStop(0, 'rgba(124, 92, 255, 0)');
      grad.addColorStop(1, isCrashed ? 'rgba(255, 77, 77, 0.25)' : 'rgba(124, 92, 255, 0.25)');
      
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(30, canvasH - 20);
      ctx.quadraticCurveTo(x * 0.5, canvasH - 20, x, y);
      ctx.lineTo(x, canvasH - 20);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = isCrashed ? 'var(--red)' : '#7c5cff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(30, canvasH - 20);
      ctx.quadraticCurveTo(x * 0.5, canvasH - 20, x, y);
      ctx.stroke();

      if (!isCrashed) createParticle(x, y);
      particles.forEach((p, idx) => {
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;
        ctx.fillStyle = isCrashed ? `rgba(255, 77, 77, ${p.alpha})` : `rgba(255, 201, 60, ${p.alpha})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        if (p.alpha <= 0) particles.splice(idx, 1);
      });

      if (!isCrashed) {
        ctx.font = '22px sans-serif';
        ctx.fillText('🚀', x - 12, y + 8);
      }
    }
  }

  function addHistory(val) {
    const wrap = document.getElementById('crashHistory');
    const chip = document.createElement('div');
    chip.className = `h-chip ${val >= 2.0 ? 'win' : 'lose'}`;
    chip.textContent = val.toFixed(2) + 'x';
    wrap.prepend(chip);
    if (wrap.children.length > 12) wrap.removeChild(wrap.lastChild);
  }

  function startEngine() {
    generateBots();
    renderBotsTable();
    gameState = 'WAITING';
    countdown = 5;
    myBetState = { placed: false, amount: 0, cashedOut: false, winAmt: 0, lost: false };
    
    actionBtn.textContent = "Stavka Tikish";
    actionBtn.className = "big-btn gold";
    multEl.textContent = "1.00x";
    multEl.className = "crash-mult-val";

    const waitTimer = setInterval(() => {
      countdown--;
      statusEl.textContent = `KEYINGI RAUND: ${countdown}s`;
      if (countdown <= 0) {
        clearInterval(waitTimer);
        runRound();
      }
    }, 1000);
  }

  function runRound() {
    gameState = 'RUNNING';
    targetCrashMult = generateCrashPoint();
    currentMult = 1.00;
    statusEl.textContent = "RAUND DAVOM ETMOTDA...";
    multEl.className = "crash-mult-val running";

    if (myBetState.placed) {
      actionBtn.textContent = "💸 YECHIB OLISH";
      actionBtn.className = "big-btn green";
    }

    let startTime = Date.now();

    const animLoop = setInterval(() => {
      let elapsed = (Date.now() - startTime) / 1000;
      currentMult = parseFloat((1.00 + Math.pow(elapsed, 1.8) * 0.15).toFixed(2));

      if (Math.random() < 0.3) playEngineSound(80 + currentMult * 20);

      currentBots.forEach(bot => {
        if (!bot.cashedOut && currentMult >= bot.cashoutAt) {
          bot.cashedOut = true;
          bot.wonAmt = Math.round(bot.bet * bot.cashoutAt);
        }
      });
      renderBotsTable();

      let progress = Math.min(1, (currentMult - 1) / 5);
      let cx = 30 + progress * (canvasW - 60);
      let cy = (canvasH - 20) - progress * (canvasH - 60);

      multEl.textContent = currentMult.toFixed(2) + 'x';
      drawCanvas(cx, cy, false);

      if (currentMult >= targetCrashMult) {
        clearInterval(animLoop);
        gameState = 'CRASHED';
        
        playExplosionSound();
        haptic('heavy');

        multEl.textContent = targetCrashMult.toFixed(2) + 'x';
        multEl.className = "crash-mult-val crashed";
        statusEl.textContent = "PORTLADI!";

        document.getElementById('canvasStage').style.transform = 'translate(2px, 2px)';
        setTimeout(()=> document.getElementById('canvasStage').style.transform = 'none', 150);

        drawCanvas(cx, cy, true);
        addHistory(targetCrashMult);

        if (myBetState.placed && !myBetState.cashedOut) {
          myBetState.lost = true;
        }
        currentBots.forEach(bot => {
          if (!bot.cashedOut) bot.lost = true;
        });
        renderBotsTable();

        actionBtn.textContent = "STAVKA KUYDI";
        actionBtn.className = "big-btn disabled";

        setTimeout(startEngine, 3500);
      }
    }, 50);
  }

  startEngine();

})();
</script>
</body>
</html>
